name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Generate mobile tRPC contract
        run: pnpm --filter web generate:trpc-types

      # Use the Web compiler for server packages; root hoisting can resolve mobile TS 6.
      - name: Typecheck
        run: |
          pnpm --filter web exec tsc -p ../../packages/types/tsconfig.json --noEmit
          pnpm --filter web exec tsc -p ../../packages/domain/tsconfig.json --noEmit
          pnpm --filter web exec tsc -p ../../packages/recommendation/tsconfig.json --noEmit
          pnpm --filter web exec tsc -p ../../packages/intervals/tsconfig.json --noEmit
          pnpm --filter web exec tsc -p ../../packages/weather/tsconfig.json --noEmit
          pnpm --filter web exec next typegen
          pnpm --filter web exec tsc --noEmit
          pnpm --filter mobile typecheck

      - name: Test
        run: pnpm -r --if-present run test
